<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preston's Lab</title>
<style>
:root{--ink:#24232a;--paper:#fffaf0;--cream:#f0e7d7;--yellow:#ffdb78;--blue:#a9dff5}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--cream);font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--ink);padding:clamp(18px,4vw,40px)}
.page{margin:auto;max-width:940px;min-height:min(690px,calc(100dvh - 80px));background:repeating-linear-gradient(to bottom,transparent 0 35px,rgba(136,166,176,.15) 36px 37px),var(--paper);border:3px solid var(--ink);border-radius:21px;box-shadow:8px 10px 0 rgba(46,36,31,.16);padding:clamp(24px,4.5vw,52px);position:relative;overflow:hidden}
h1{font-size:clamp(36px,6vw,60px);letter-spacing:-.055em;line-height:1.1;margin:0;font-weight:1000;display:inline-block;position:relative}
h1::after{content:"";display:block;height:9px;background:var(--yellow);border-radius:100%;transform:rotate(-1.5deg);margin-top:-3px;position:relative;z-index:-1}
.projects{margin-top:clamp(52px,10vh,110px);display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.project{width:clamp(190px,26vw,225px);min-height:186px;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:20px;text-align:center;padding:25px 16px;background:var(--yellow);border:3px solid var(--ink);border-radius:24px;box-shadow:5px 6px 0 rgba(36,35,42,.2);color:var(--ink);text-decoration:none;transform:rotate(-1.3deg);transition:transform .16s ease,box-shadow .16s ease}
.project:hover,.project:focus-visible{transform:rotate(0deg) translateY(-5px);box-shadow:7px 10px 0 rgba(36,35,42,.22)}
.project:focus-visible{outline:3px solid #547c9a;outline-offset:5px}
.project-name{font-weight:1000;font-size:28px;letter-spacing:-.055em}
.play{border:2px solid var(--ink);background:var(--paper);padding:7px 17px;border-radius:999px;font-size:13px;font-weight:1000;letter-spacing:.06em}
@media(max-width:560px){.page{min-height:calc(100dvh - 36px);padding:28px 22px}.projects{margin-top:70px}.project{width:190px;min-height:170px}}
@media(prefers-reduced-motion:reduce){.project{transition:none}}
</style>
</head>
<body>
<main class="page">
<h1>Preston's Lab</h1>
<div class="projects"><a class="project" href="games/quizbound.html" aria-label="Play QUIZBOUND"><span class="project-name">QUIZBOUND</span><span class="play">PLAY ↗</span></a></div>
</main>
</body>
</html>
